name: Build Windows App

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build installer + portable exe
        run: npx electron-builder --win --publish never

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: KitchenFlow-Windows
          path: dist/*.exe
          if-no-files-found: error
