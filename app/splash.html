<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>KitchenFlow</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:transparent;overflow:hidden;font-family:"Segoe UI",Arial,sans-serif;-webkit-user-select:none;user-select:none;cursor:default}
.card{position:absolute;inset:14px;background:#fff;border-radius:14px;box-shadow:0 10px 34px rgba(16,40,64,.35);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  opacity:0;transform:scale(.97);animation:in .45s ease-out forwards}
.card.out{animation:out .35s ease-in forwards}
@keyframes in{to{opacity:1;transform:none}}
@keyframes out{from{opacity:1;transform:none}to{opacity:0;transform:scale(.98)}}
.logo{width:470px;height:auto;margin-top:-6px}
.tag{margin-top:10px;font-size:13px;color:#5d6b82;letter-spacing:.04em}
.bar{position:absolute;left:46px;right:46px;bottom:52px;height:4px;border-radius:2px;background:#e6ebf1;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;width:38%;border-radius:2px;background:linear-gradient(90deg,#123a5c,#c8714d);animation:slide 1.15s ease-in-out infinite}
@keyframes slide{0%{left:-38%}100%{left:100%}}
.foot{position:absolute;left:46px;right:46px;bottom:22px;display:flex;justify-content:space-between;font-size:11px;color:#8b97a8}
</style></head>
<body>
<div class="card" id="card">
  <img class="logo" src="kitchenflow-logo.png" alt="KitchenFlow" draggable="false">
  <div class="tag">Kitchen layout · countertops · slab planning</div>
  <div class="bar"><i></i></div>
  <div class="foot"><span id="status">Loading…</span><span id="ver"></span></div>
</div>
<script>
var v=new URLSearchParams(location.search).get('v');
if(v)document.getElementById('ver').textContent='Version '+v;
window.splashOut=function(){document.getElementById('card').classList.add('out');};
</script>
</body></html>
